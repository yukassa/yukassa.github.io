<rect width="100%" height="100%" fill="#0b0d12"/>
<text x="90" y="70" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="34" font-weight="700" fill="#e8ecf5" text-anchor="start">Crowd Simulation &amp; Optimization — Architecture</text><text x="90" y="108" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="400" fill="#9aa4ba" text-anchor="start">Go-based real-time simulation, browser visualization, comparison and optimization</text><g filter="url(#shadow)"><rect x="90" y="170" width="470" height="760" rx="24" fill="#121622" stroke="#2b3550" stroke-width="2"/><text x="125" y="220" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8ecf5" text-anchor="start">Browser UI</text><text x="125" y="252" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="500" fill="#67d4e8" text-anchor="start">JavaScript / p5.js / Chart.js</text><rect x="125" y="290" width="400" height="130" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="150" y="330" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Simulation View</text><text x="150" y="363" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="150" dy="0">エージェント描画・スタート/ゴールゾーン</tspan><tspan x="150" dy="26.099999999999998">壁・誘導板の配置 / 移動 / 削除</tspan></text><rect x="125" y="445" width="400" height="160" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="150" y="485" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Controls</text><text x="150" y="518" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="150" dy="0">人数・速度・経路探索・局所回避を変更</tspan><tspan x="150" dy="26.099999999999998">配置探索の開始 / 停止 / 重み調整</tspan><tspan x="150" dy="26.099999999999998">配置パターンの保存・適用</tspan></text><rect x="125" y="630" width="400" height="170" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="150" y="670" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Analysis &amp; Results</text><text x="150" y="703" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="150" dy="0">18通りのアルゴリズム比較・ヒートマップ</tspan><tspan x="150" dy="26.099999999999998">配置候補の比較グラフ</tspan><tspan x="150" dy="26.099999999999998">最適化の進捗 / Fitness 推移</tspan></text><rect x="125" y="825" width="400" height="70" rx="16" fill="#111827" stroke="#2b3550" stroke-width="1.5"/><text x="150" y="868" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="650" fill="#4fd1a5" text-anchor="start">Interactive experiment UI</text></g><g filter="url(#shadow)"><rect x="710" y="170" width="690" height="760" rx="24" fill="#121622" stroke="#2b3550" stroke-width="2"/><text x="750" y="220" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="30" font-weight="700" fill="#e8ecf5" text-anchor="start">Go Simulation Server</text><text x="750" y="252" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="500" fill="#4fd1a5" text-anchor="start">Simulation / Evaluation / Optimization</text><rect x="750" y="290" width="610" height="90" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="780" y="326" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="22" font-weight="650" fill="#f4d35e" text-anchor="start">map_config.json</text><text x="780" y="355" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start">初期マップ・オブジェクト・ゾーン設定を読み込み</text><rect x="750" y="410" width="285" height="205" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="775" y="450" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Real-time Simulation</text><text x="775" y="486" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="775" dy="0">20 Hz で状態更新</tspan><tspan x="775" dy="25.2">6種の大域経路探索</tspan><tspan x="775" dy="25.2">3種の局所回避</tspan><tspan x="775" dy="25.2">動的な経路再計算</tspan></text><rect x="1075" y="410" width="285" height="205" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="1100" y="450" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Evaluation &amp; Comparison</text><text x="1100" y="486" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="1100" dy="0">描画なしの評価用シミュレーション</tspan><tspan x="1100" dy="25.2">18通りの一括比較</tspan><tspan x="1100" dy="25.2">到達時間・速度・密度・到達率</tspan><tspan x="1100" dy="25.2">ボトルネック分析</tspan></text><rect x="750" y="650" width="610" height="230" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="780" y="690" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="23" font-weight="650" fill="#e8ecf5" text-anchor="start">Placement Optimization</text><text x="780" y="725" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="650" fill="#b794f4" text-anchor="start">GA / SA / NSGA-II</text><text x="780" y="760" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="400" fill="#9aa4ba" text-anchor="start"><tspan x="780" dy="0">配置候補ごとにシミュレーション結果を評価</tspan><tspan x="780" dy="27.0">複数候補を並列評価し、同一配置は結果を再利用</tspan><tspan x="780" dy="27.0">混雑しやすい場所を初期候補生成へ反映</tspan></text></g><g filter="url(#shadow)"><rect x="1480" y="170" width="250" height="760" rx="24" fill="#121622" stroke="#2b3550" stroke-width="2"/><text x="1515" y="220" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="28" font-weight="700" fill="#e8ecf5" text-anchor="start">Communication</text><rect x="1515" y="285" width="180" height="125" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="1605" y="325" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="21" font-weight="700" fill="#6ea8fe" text-anchor="middle">WebSocket</text><text x="1605" y="355" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa4ba" text-anchor="middle"><tspan x="1605" dy="0">リアルタイム状態配信</tspan><tspan x="1605" dy="23.799999999999997">編集操作</tspan></text><rect x="1515" y="445" width="180" height="145" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="1605" y="485" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="21" font-weight="700" fill="#f6b26b" text-anchor="middle">HTTP API</text><text x="1605" y="515" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa4ba" text-anchor="middle"><tspan x="1605" dy="0">評価・比較</tspan><tspan x="1605" dy="23.799999999999997">最適化制御</tspan><tspan x="1605" dy="23.799999999999997">保存 / 適用</tspan></text><rect x="1515" y="625" width="180" height="125" rx="16" fill="#171c2a" stroke="#2b3550" stroke-width="1.5"/><text x="1605" y="665" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="21" font-weight="700" fill="#b794f4" text-anchor="middle">SSE</text><text x="1605" y="695" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="17" font-weight="400" fill="#9aa4ba" text-anchor="middle"><tspan x="1605" dy="0">最適化進捗を</tspan><tspan x="1605" dy="23.799999999999997">逐次配信</tspan></text><rect x="1515" y="790" width="180" height="100" rx="16" fill="#111827" stroke="#2b3550" stroke-width="1.5"/><text x="1605" y="827" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#e8ecf5" text-anchor="middle">Responsibility</text><text x="1605" y="855" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="16" font-weight="400" fill="#9aa4ba" text-anchor="middle"><tspan x="1605" dy="0">計算は Go 側</tspan><tspan x="1605" dy="21.6">描画・操作は Browser</tspan></text></g><line x1="1055" y1="380" x2="1055" y2="405" stroke="#9aa4ba" stroke-width="3" marker-end="url(#arrow)"/><path d="M 1035 512 C 1055 512, 1055 512, 1075 512" fill="none" stroke="#9aa4ba" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="8 6" marker-end="url(#arrow)"/><path d="M 892 615 C 892 630, 892 635, 892 648" fill="none" stroke="#9aa4ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 1218 615 C 1218 630, 1218 635, 1218 648" fill="none" stroke="#9aa4ba" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><path d="M 560 350 C 610 350, 650 350, 710 350" fill="none" stroke="#6ea8fe" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="635" y="336" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#6ea8fe" text-anchor="middle">WebSocket</text><text x="635" y="378" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="15" font-weight="400" fill="#9aa4ba" text-anchor="middle">状態 / 編集</text><path d="M 560 515 C 610 515, 650 515, 710 515" fill="none" stroke="#f6b26b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="635" y="501" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#f6b26b" text-anchor="middle">HTTP API</text><text x="635" y="543" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="15" font-weight="400" fill="#9aa4ba" text-anchor="middle">評価 / 比較 / 制御</text><path d="M 710 690 C 660 690, 610 690, 560 690" fill="none" stroke="#b794f4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/><text x="635" y="676" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="18" font-weight="650" fill="#b794f4" text-anchor="middle">SSE</text><text x="635" y="718" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="15" font-weight="400" fill="#9aa4ba" text-anchor="middle">最適化進捗</text><rect x="90" y="965" width="1640" height="70" rx="18" fill="#0f131d" stroke="#2b3550" stroke-width="1.5"/><text x="120" y="1008" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="700" fill="#e8ecf5" text-anchor="start">Design principle:</text><text x="285" y="1008" font-family="Inter, Noto Sans JP, Arial, sans-serif" font-size="20" font-weight="500" fill="#9aa4ba" text-anchor="start">計算量の大きいシミュレーション・比較・最適化は Go 側、ブラウザは可視化と操作に集中</text></svg>