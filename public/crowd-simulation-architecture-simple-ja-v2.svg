<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">人流シミュレータのシステム構成</title>
  <desc id="desc">ブラウザUI、Goシミュレーションエンジン、リアルタイム実行、描画なし評価、定量評価、GAによる壁配置探索を簡潔に示す構成図</desc>

  <defs>
    <style>
      text {
        font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
        fill: #263746;
      }
      .title { font-size: 28px; font-weight: 700; }
      .subtitle { font-size: 14px; fill: #66788a; }
      .h1 { font-size: 20px; font-weight: 700; }
      .h2 { font-size: 15px; font-weight: 700; }
      .body { font-size: 14px; }
      .small { font-size: 12px; fill: #647789; }

      .box { fill:#fff; stroke:#c8d3de; stroke-width:2; }
      .ui { fill:#eef6ff; stroke:#78a8d6; }
      .core { fill:#f4f9ff; stroke:#6d9dcc; }
      .live { fill:#f7fbff; stroke:#98b6d1; }
      .eval { fill:#f8f5ff; stroke:#9b89c8; }
      .metrics { fill:#f6f8fb; stroke:#a8b6c4; }
      .ga { fill:#fff8f0; stroke:#d59a56; }
      .inner { fill:#fff; stroke:#bcc9d5; stroke-width:1.5; }
      .note { fill:#fbfcfe; stroke:#d7e0e8; stroke-width:1.5; }

      .arrow { stroke:#657c91; stroke-width:2.2; fill:none; marker-end:url(#arrowHead); }
      .arrowAccent { stroke:#8c79b8; stroke-width:2.2; fill:none; marker-end:url(#arrowPurple); }
    </style>

    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#657c91"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c79b8"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fafc"/>

  <text class="title" x="50" y="48">人流シミュレータのシステム構成</text>
  <text class="subtitle" x="50" y="76">同じ移動ロジックを、リアルタイム観察・定量評価・GA探索に再利用</text>

  <!-- Browser -->
  <rect class="box ui" x="50" y="140" width="245" height="390" rx="18"/>
  <text class="h1" x="78" y="180">ブラウザUI</text>
  <text class="small" x="78" y="202">JavaScript / p5.js / Chart.js</text>

  <text class="h2" x="78" y="246">条件変更</text>
  <text class="body" x="88" y="274">• 人数・歩行速度</text>
  <text class="body" x="88" y="299">• 壁の配置</text>
  <text class="body" x="88" y="324">• 人流シナリオ</text>

  <text class="h2" x="78" y="370">可視化・分析</text>
  <text class="body" x="88" y="398">• 人流をリアルタイム表示</text>
  <text class="body" x="88" y="423">• 3指標を比較</text>
  <text class="body" x="88" y="448">• 探索前 / 最良候補を比較</text>

  <rect class="note" x="75" y="476" width="195" height="34" rx="10"/>
  <text class="small" x="90" y="498">条件変更 → 観察 → 評価 → 探索</text>

  <!-- Core -->
  <rect class="box core" x="385" y="120" width="360" height="260" rx="18"/>
  <text class="h1" x="415" y="160">Go シミュレーションエンジン</text>
  <text class="small" x="415" y="183">共通の移動ロジック</text>

  <rect class="inner" x="415" y="210" width="300" height="62" rx="12"/>
  <text class="h2" x="435" y="235">大域経路探索</text>
  <text class="body" x="435" y="258">A* / Flow Field</text>

  <rect class="inner" x="415" y="292" width="300" height="62" rx="12"/>
  <text class="h2" x="435" y="317">局所回避</text>
  <text class="body" x="435" y="340">Force-based separation / Social Force Model</text>

  <!-- Execution modes -->
  <text class="small" x="466" y="409">同じ移動ロジックを2つの実行方法で利用</text>

  <rect class="box live" x="385" y="435" width="165" height="105" rx="15"/>
  <text class="h2" x="410" y="468">リアルタイム実行</text>
  <text class="body" x="410" y="495">約20Hzで更新</text>
  <text class="small" x="410" y="519">WebSocketで状態配信</text>

  <rect class="box eval" x="580" y="435" width="165" height="105" rx="15"/>
  <text class="h2" x="605" y="468">描画なし評価</text>
  <text class="body" x="605" y="495">固定時間を実行</text>
  <text class="small" x="605" y="519">比較・GA評価で利用</text>

  <!-- Metrics -->
  <rect class="box metrics" x="835" y="120" width="315" height="170" rx="18"/>
  <text class="h1" x="865" y="160">定量評価</text>
  <text class="body" x="875" y="198">• 平均到達時間</text>
  <text class="body" x="875" y="225">• 最大混雑度</text>
  <text class="body" x="875" y="252">• 到達率</text>
  <text class="small" x="865" y="276">simulation_seedで比較条件をそろえる</text>

  <!-- GA -->
  <rect class="box ga" x="835" y="350" width="315" height="190" rx="18"/>
  <text class="h1" x="865" y="390">GAによる壁配置探索</text>
  <text class="body" x="875" y="425">候補配置を生成</text>
  <text class="body" x="875" y="452">→ 描画なし評価を繰り返す</text>
  <text class="body" x="875" y="479">→ Fitnessで候補を比較</text>
  <text class="small" x="865" y="513">配置可能領域・重複・経路遮断などを制約</text>

  <!-- Main arrows -->
  <path class="arrow" d="M295 248 H385"/>
  <text class="small" x="309" y="235">設定・編集</text>

  <path class="arrow" d="M385 190 H338 V175 H295"/>
  <text class="small" x="307" y="163">状態配信</text>

  <path class="arrow" d="M470 380 V435"/>
  <path class="arrow" d="M665 380 V435"/>

  <path class="arrow" d="M745 487 H790 V220 H835"/>
  <text class="small" x="773" y="207">評価結果</text>

  <path class="arrow" d="M835 445 H790 V487 H745"/>
  <text class="small" x="760" y="472">候補ごとに評価</text>

  <path class="arrowAccent" d="M995 350 V290"/>
  <text class="small" x="1008" y="326">3指標 / Fitness</text>

  <!-- Protocol labels -->
  <rect class="note" x="360" y="575" width="430" height="54" rx="12"/>
  <text class="small" x="382" y="598">WebSocket：リアルタイム状態配信・編集操作</text>
  <text class="small" x="382" y="619">HTTP API：評価・4通り比較・GA配置探索</text>

  <!-- Footer -->
  <rect class="note" x="50" y="652" width="1100" height="32" rx="10"/>
  <text class="body" x="70" y="674">要点：経路探索と局所回避を切り替え可能にし、同じシミュレーションロジックを「観察」「比較」「GA探索」へ接続</text>
</svg>
